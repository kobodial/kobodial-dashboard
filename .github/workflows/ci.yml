name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci rather than npm install: the committed lockfile is what
      # makes the pinned versions mean anything, and ci fails loudly if
      # the two ever disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      # next build type-checks too, but running tsc on its own reports a
      # type error as a type error rather than as a failed build step.
      - name: Typecheck
        run: npm run typecheck

      # The build needs no gateway: every page catches
      # GatewayUnavailableError and renders its unavailable state, so a
      # CI runner with nothing on the other end still builds cleanly —
      # which is the same property that keeps the deployed app from
      # going blank when the gateway is down.
      - name: Build
        run: npm run build
